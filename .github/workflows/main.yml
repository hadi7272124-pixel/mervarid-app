name: Build Mervarid APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build_project

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.mervarid \
            --project-name mervarid_app \
            --no-pub .

      - name: Configure Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle.kts ]; then

            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              android/app/build.gradle.kts

            sed -i \
              's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              android/app/build.gradle.kts

          elif [ -f android/app/build.gradle ]; then

            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              android/app/build.gradle

            sed -i \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
              android/app/build.gradle

            sed -i \
              's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              android/app/build.gradle

            sed -i \
              's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' \
              android/app/build.gradle

          else
            echo "ERROR: Android Gradle file not found"
            find android -maxdepth 4 -type f
            exit 1
          fi

      - name: Get dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mervarid-APK
          path: build_project/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
