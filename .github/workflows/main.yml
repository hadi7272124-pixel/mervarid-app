name: Build Mervarid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using project: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build_project

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            find build_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Recreate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=mervarid \
            --org=com.mervarid \
            --no-pub \
            .

      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Android files:"
          find android -maxdepth 3 -type f | sort | head -100

          if [ -f android/app/build.gradle ]; then

            python3 - <<'PY'
from pathlib import Path

p = Path("android/app/build.gradle")
s = p.read_text()

s = s.replace(
    "compileSdk = flutter.compileSdkVersion",
    "compileSdk = 36"
)

s = s.replace(
    "compileSdkVersion flutter.compileSdkVersion",
    "compileSdkVersion 36"
)

p.write_text(s)
PY

          elif [ -f android/app/build.gradle.kts ]; then

            python3 - <<'PY'
from pathlib import Path

p = Path("android/app/build.gradle.kts")
s = p.read_text()

s = s.replace(
    "compileSdk = flutter.compileSdkVersion",
    "compileSdk = 36"
)

s = s.replace(
    "compileSdk = flutter.compileSdkVersion",
    "compileSdk = 36"
)

p.write_text(s)
PY

          else
            echo "ERROR: Android app Gradle file not found"
            find android -maxdepth 3 -type f
            exit 1
          fi

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Check Dart code
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          dart format lib/main.dart

          flutter analyze lib/main.dart

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mervarid-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
