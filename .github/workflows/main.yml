name: Build Mervarid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using project: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build_project

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Recreate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --no-pub .

      - name: Set Android compile SDK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          sed -i 's/compileSdk = 31/compileSdk = 36/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 31/compileSdkVersion 36/g' android/app/build.gradle

          if grep -q "compileSdk" android/app/build.gradle; then
            echo "compileSdk configuration:"
            grep -n "compileSdk" android/app/build.gradle
          fi

      - name: Fix Dart syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")

          if not p.exists():
              print("main.dart not found")
              raise SystemExit(1)

          s = p.read_text(encoding="utf-8")

          old = "PdfPage(startPage:p['page'] as int)));}))"
          new = "PdfPage(startPage:p['page'] as int))));}))"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("Dart syntax fixed.")
          else:
              print("Dart syntax already fixed or target not found.")

          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mervarid-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
