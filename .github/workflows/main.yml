name: Build Mervarid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using project: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build_project

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PWD/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PWD/$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Recreate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --no-pub .

      - name: Configure Android SDK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              s
          )

          s = re.sub(
              r'compileSdkVersion\s+[^\n]+',
              'compileSdkVersion 36',
              s
          )

          p.write_text(s, encoding="utf-8")

          print("Android compile SDK configured to 36.")
          PY

          grep -n "compileSdk" android/app/build.gradle || true

      - name: Fix Dart syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")

          if not p.exists():
              raise SystemExit("ERROR: lib/main.dart not found")

          s = p.read_text(encoding="utf-8")

          old = "PdfPage(startPage:p['page'] as int)));}))"
          new = "PdfPage(startPage:p['page'] as int))));}))"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("Dart syntax fixed.")
          else:
              print("Dart syntax already fixed or target not found.")

          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mervarid-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
